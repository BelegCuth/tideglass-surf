name: Build signed Play release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIDEGLASS_UPLOAD_STORE_FILE: ${{ runner.temp }}/tideglass-upload.jks
      TIDEGLASS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      TIDEGLASS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      TIDEGLASS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the private upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$TIDEGLASS_UPLOAD_STORE_PASSWORD"
          test -n "$TIDEGLASS_UPLOAD_KEY_ALIAS"
          test -n "$TIDEGLASS_UPLOAD_KEY_PASSWORD"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$TIDEGLASS_UPLOAD_STORE_FILE"
          test -s "$TIDEGLASS_UPLOAD_STORE_FILE"
      - name: Test, lint and build signed Play bundles
        run: >-
          ./gradlew
          :marine-provider:testDebugUnitTest
          :marine-provider:lintRelease
          :marine-provider:bundleRelease
          :watchface:lintRelease
          :watchface:bundleRelease
          -Ptideglass.dataBaseUrl=https://data.tideglass.me
          -Ptideglass.requireReleaseSigning=true
      - name: Verify bundle signatures
        run: |
          jarsigner -verify marine-provider/build/outputs/bundle/release/marine-provider-release.aab
          jarsigner -verify watchface/build/outputs/bundle/release/watchface-release.aab
      - name: Upload signed Play bundles
        uses: actions/upload-artifact@v4
        with:
          name: tideglass-play-signed-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            marine-provider/build/outputs/bundle/release/marine-provider-release.aab
            watchface/build/outputs/bundle/release/watchface-release.aab
