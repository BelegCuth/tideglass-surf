name: Configure Tideglass custom domain

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  configure-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Associate data.tideglass.me with Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/tideglass-data/domains"
          domains="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${endpoint}")"

          existing="$(jq -c '.result[]? | select(.name == "data.tideglass.me")' <<<"${domains}")"
          if [[ -n "${existing}" ]]; then
            status="$(jq -r '.status' <<<"${existing}")"
            validation="$(jq -r '.validation_data.status' <<<"${existing}")"
            verification="$(jq -r '.verification_data.status' <<<"${existing}")"
            echo "Custom domain is already associated: status=${status}, validation=${validation}, verification=${verification}."
            exit 0
          fi

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"data.tideglass.me"}' \
            "${endpoint}")"
          jq -e '.success == true' <<<"${response}" >/dev/null
          echo "Custom domain associated with Tideglass Pages."
